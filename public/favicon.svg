<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="nexora-tech-title">
  <title id="nexora-tech-title">Nexora Modular Systems Core Icon</title>
  <defs>
    <linearGradient id="tech-grad-a" x1="12" y1="52" x2="52" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="tech-grad-b" x1="18" y1="46" x2="52" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#0B1120"/>
  <!-- Upper-left stepped system block (primary input/orchestration module) -->
  <path d="M14 16 H38 V26 H24 V48 H14 Z" fill="url(#tech-grad-a)"/>
  <!-- Lower-right stepped system block (output/execution module) -->
  <path d="M26 38 H40 V16 H50 V48 H26 Z" fill="url(#tech-grad-b)"/>
